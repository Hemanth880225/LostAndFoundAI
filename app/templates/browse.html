{% extends "base.html" %}{% block title %}Browse reports — Foundly{% endblock %}{% block content %}
<section class="page-hero wrap compact-hero"><div class="eyebrow">COMMUNITY REPORTS</div><h1>Help something<br><span>find its way back.</span></h1><p class="lead">Browse recent lost and found reports. A small detail might be the one that matters.</p></section>
<section class="wrap browse-wrap"><div class="filter-bar"><label class="search-box"><span>⌕</span><input id="search-input" type="search" placeholder="Search loaded reports…" aria-label="Search loaded reports"></label><select id="type-filter" aria-label="Report type"><option value="">All reports</option><option value="lost">Lost items</option><option value="found">Found items</option></select><select id="category-filter" aria-label="Category"><option value="">All categories</option></select><button class="button button-light button-small" id="clear-filters">Clear filters</button></div><p id="result-count" class="result-count"></p><div id="report-list" class="report-grid browse-grid"><div class="skeleton card-skeleton"></div><div class="skeleton card-skeleton"></div><div class="skeleton card-skeleton"></div></div><div class="browse-actions"><button id="load-more" class="button button-light" hidden>Load more</button></div><div id="browse-state" class="state-panel" role="status"></div></section>
{% endblock %}{% block scripts %}<script defer src="/static/js/browse.js"></script>{% endblock %}
