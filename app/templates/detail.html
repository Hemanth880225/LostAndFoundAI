{% extends "base.html" %}{% block title %}Report details — Foundly{% endblock %}{% block content %}
<section class="wrap detail-page"><a href="/browse" class="back-link">← Back to browse</a><div id="detail-state" class="state-panel">Loading report…</div><div id="detail-content" class="detail-layout" data-id="{{ report_id }}" hidden><div class="detail-image" id="detail-image"><span class="image-placeholder">✳</span></div><div class="detail-copy"><div id="detail-badge"></div><h1 id="detail-name"></h1><p id="detail-meta" class="detail-meta"></p><div class="detail-divider"></div><h3>About this item</h3><p id="detail-description" class="detail-description"></p><div class="detail-facts" id="detail-facts"></div><div class="detail-actions" id="detail-actions"></div><form id="claim-form" class="panel claim-form" hidden><div class="form-section-title"><span class="section-count">♡</span><div><h2>Make a claim</h2><p>Share enough detail to start a safe conversation.</p></div></div><label class="field">Your lost report ID<input name="lost_report_id" inputmode="numeric" required placeholder="The ID shown on your lost report"></label><label class="field">Your name<input name="claimant_name" required minlength="2" maxlength="120"></label><label class="field">Email<input type="email" name="contact_email" required maxlength="254"></label><label class="field">Why do you think this is yours?<textarea name="claim_message" required minlength="10" maxlength="2000" rows="4" placeholder="Describe a private identifying detail. Do not include passwords or unlock codes."></textarea></label><div id="claim-error" class="form-error" role="alert"></div><button class="button" type="submit">Submit claim</button></form></div></div></section>
{% endblock %}{% block scripts %}<script defer src="/static/js/detail.js"></script>{% endblock %}
